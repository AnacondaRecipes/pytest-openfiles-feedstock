{% set name = "pytest-openfiles" %}
{% set version = "0.6.0" %}
{% set git_url = "https://github.com/astropy/pytest-openfiles" %}
{% set sha256 = "ff5160c34eaada82b983a2c316fcccb30e0094630e97784471f015956870a993" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pytest_openfiles-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: python -m pip install --no-deps --ignore-installed .
  skip: true  # [py<37]

requirements:
  host:
    - python
    - pip
    - pytest >=3.1
    - psutil
    - setuptools_scm
    - setuptools >=30.3.0
    - setuptools-scm
    - wheel
  run:
    - python
    - pytest >=4.6
    - psutil
    - packaging

test:
  imports:
    - pytest_openfiles

about:
  home: {{ git_url }}
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.rst
  summary: Pytest plugin for detecting inadvertent open file handles
  description: |
    This package provides a plugin for the pytest framework that allows
    developers to detect whether any file handles or other file-like objects
    were inadvertently left open at the end of a unit test.
  doc_url: {{ git_url }}
  dev_url: {{ git_url }}

extra:
  recipe-maintainers:
    - astrofrog-conda-forge
    - drdavella
    - mwcraig